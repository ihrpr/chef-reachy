[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "chef_reachy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reachy-mini"]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
chef_reachy = "chef_reachy.main:ChefReachy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
chef_reachy = ["**/*"] # Also include all non-.py files

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = ["pyright>=1.1.407", "ruff>=0.14.10"]
