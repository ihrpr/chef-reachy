[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "chef_reachy"
version = "0.3.0"
description = "Chef Reachy - Voice-activated food inventory assistant with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini[gstreamer]>=1.2.4",
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "faster-whisper>=1.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "kokoro>=0.2.8",
    "soundfile>=0.12.0",
    "torchaudio>=2.0.0",
]
keywords = ["reachy-mini-app", "voice-assistant", "food-inventory", "claude-agent", "whisper"]

[project.entry-points."reachy_mini_apps"]
chef_reachy = "chef_reachy.main:ChefReachy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
chef_reachy = ["**/*"] # Also include all non-.py files

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = ["pyright>=1.1.407", "ruff>=0.14.10"]
